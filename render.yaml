services:
  - type: web
    name: yojanavaani-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: YojanaVaani Backend
      - key: DATABASE_URL
        value: sqlite:////app/yojanavaani.db
      - key: HF_HUB_OFFLINE
        value: "0"
