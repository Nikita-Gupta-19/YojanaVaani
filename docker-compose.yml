services:
  postgres:
    image: postgres:16-alpine
    container_name: yojanavaani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yojana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yojana123}
      POSTGRES_DB: ${POSTGRES_DB:-yojanavaani}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yojana} -d ${POSTGRES_DB:-yojanavaani}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yojanavaani_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=YojanaVaani Backend
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-yojana}:${POSTGRES_PASSWORD:-yojana123}@postgres:5432/${POSTGRES_DB:-yojanavaani}
      - POSTGRES_USER=${POSTGRES_USER:-yojana}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yojana123}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-yojanavaani}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
